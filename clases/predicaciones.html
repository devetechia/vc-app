<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicaciones - Academia Biblica</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar scrolled" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="logos/logo vc.png" alt="Vida Cristiana" class="nav-logo-img">
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="navLinks">
                <span></span><span></span><span></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="nav-link">Inicio</a></li>
                <li><a href="predicaciones.html" class="nav-link active">Predicaciones</a></li>
                <li><a href="tests.html" class="nav-link">Tests</a></li>
                <li><a href="notas.html" class="nav-link">Mis Apuntes</a></li>
            </ul>
        </div>
    </nav>

    <div class="studio-layout">
        <div class="container">
            <div class="section-header" style="padding-top:24px;">
                <span class="section-tag">Palabra</span>
                <h2 class="section-title">Todas las Predicaciones</h2>
                <div class="section-line"></div>
                <p class="section-desc">Selecciona una predicacion para estudiarla, ver la transcripcion o hacer un test.</p>
            </div>

            <div class="search-bar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" id="searchInput" placeholder="Buscar predicacion..." aria-label="Buscar predicacion">
                <button id="searchClear" aria-label="Limpiar busqueda" style="display:none; position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:18px;">×</button>
            </div>

            <div class="sermons-grid" id="sermonsGrid">
                <div class="loading"><div class="loading-spinner"></div><p>Cargando predicaciones...</p></div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>Academia Biblica - Iglesia Vida Cristiana 2026</p>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        initNavbar();
        let allVideos = [];

        fetchYouTubeVideos(50).then(videos => {
            allVideos = videos;
            renderSermons(videos);
        }).catch((err) => {
            const isQuota = err && err.message === 'quotaExceeded';
            document.getElementById('sermonsGrid').innerHTML = isQuota
                ? '<div class="empty-state"><h3>Cuota de YouTube alcanzada</h3><p>Has alcanzado el limite diario de la API. Intenta de nuevo manana o recarga la pagina (usa cache local).</p><button class="btn btn-outline btn-sm" onclick="location.reload()" style="margin-top:12px;">Reintentar</button></div>'
                : '<div class="empty-state"><h3>Error al cargar</h3><p>No se pudieron cargar las predicaciones. Verifica tu conexion y que el servidor este corriendo en localhost:5000.</p></div>';
        });

        function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
        function highlight(text, q) {
            if (!q) return escapeHtml(text);
            const re = new RegExp('(' + escapeRegExp(q) + ')', 'gi');
            return escapeHtml(text).replace(re, '<mark style="background:rgba(139,92,246,0.3); color:inherit; padding:0 2px; border-radius:3px;">$1</mark>');
        }

        let currentQuery = '';
        function renderSermons(videos) {
            const grid = document.getElementById('sermonsGrid');
            if (!videos.length) {
                grid.innerHTML = '<div class="empty-state"><h3>Sin resultados</h3><p>No se encontraron predicaciones para "' + escapeHtml(currentQuery) + '".</p></div>';
                return;
            }
            grid.innerHTML = videos.map((v, i) => `
                <a href="estudio.html?id=${v.id}" class="sermon-card">
                    <div class="sermon-thumb">
                        <img src="${v.thumbnail}" alt="${escapeHtml(v.title)}" loading="lazy" width="480" height="270">
                        <div class="sermon-play" aria-hidden="true">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                        ${i === 0 ? '<span class="sermon-badge">Reciente</span>' : ''}
                    </div>
                    <div class="sermon-info">
                        <h3>${highlight(v.title, currentQuery)}</h3>
                        <p>${escapeHtml(v.date)}</p>
                    </div>
                </a>
            `).join('');
        }

        function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');
        searchInput.addEventListener('input', debounce((e) => {
            currentQuery = e.target.value.trim();
            searchClear.style.display = currentQuery ? 'block' : 'none';
            const q = currentQuery.toLowerCase();
            const filtered = !q ? allVideos : allVideos.filter(v =>
                v.title.toLowerCase().includes(q) || (v.description && v.description.toLowerCase().includes(q))
            );
            renderSermons(filtered);
        }, 250));
        searchClear.addEventListener('click', () => {
            searchInput.value = ''; currentQuery = ''; searchClear.style.display = 'none';
            renderSermons(allVideos); searchInput.focus();
        });
    </script>
</body>
</html>
